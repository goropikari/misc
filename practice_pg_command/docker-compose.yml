services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: practice
      POSTGRES_PASSWORD: practice
      POSTGRES_DB: practice
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practice -d practice"]
      interval: 2s
      timeout: 3s
      retries: 15
  server:
    build: .
    environment:
      DATABASE_URL: postgres://practice:practice@postgres:5432/practice?sslmode=disable
    ports:
      - "5432:5432"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
