static_resources:
  listeners:
    - name: demo_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: demo
                route_config:
                  name: demo_routes
                  virtual_hosts:
                    - name: demos
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/admin"
                          route:
                            cluster: authz
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match:
                            prefix: "/v1/audit"
                          route:
                            cluster: authz
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                        - match:
                            prefix: "/demo-a"
                          route:
                            cluster: demo_a
                            regex_rewrite:
                              pattern:
                                google_re2: {}
                                regex: "^/demo-a"
                              substitution: ""
                          request_headers_to_add:
                            - header:
                                key: x-authz-permission
                                value: demo-a.dashboard.view
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - header:
                                key: x-authz-entitlement
                                value: demo-a.dashboard
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - match:
                            prefix: "/demo-b"
                          route:
                            cluster: demo_b
                            regex_rewrite:
                              pattern:
                                google_re2: {}
                                regex: "^/demo-b"
                              substitution: ""
                          request_headers_to_add:
                            - header:
                                key: x-authz-permission
                                value: demo-b.dashboard.view
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                            - header:
                                key: x-authz-entitlement
                                value: demo-b.dashboard
                              append_action: OVERWRITE_IF_EXISTS_OR_ADD
                        - match:
                            prefix: "/healthz"
                          route:
                            cluster: demo_a
                          typed_per_filter_config:
                            envoy.filters.http.ext_authz:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                              disabled: true
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      failure_mode_allow: false
                      http_service:
                        server_uri:
                          uri: http://authz:8080
                          cluster: authz
                          timeout: 0.2s
                        path_prefix: /v1/ext-authz/check
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: x-user-id
                              - exact: x-tenant-id
                              - exact: x-authz-permission
                              - exact: x-authz-entitlement
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: authz
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: authz
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: authz
                      port_value: 8080
    - name: demo_a
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: demo_a
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: demo-a
                      port_value: 8080
    - name: demo_b
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: demo_b
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: demo-b
                      port_value: 8080
